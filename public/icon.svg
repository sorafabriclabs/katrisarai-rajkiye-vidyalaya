<!--
  The icon mark: the college's colours and the open book from the centre of
  its seal, and nothing else.

  This is deliberately NOT `college-mark.png`. That file is the real seal —
  a tree, a lamp, a stupa, and the college's name set around the rim — and it
  is the right thing in the masthead at 84px. At the 16 and 32 pixels a
  browser tab gives an icon, every one of those elements is under two pixels
  and the whole thing renders as a gold-brown smudge that could be any
  institution in Bihar.

  So the small icons are drawn rather than downsampled: two shapes, flat
  colour, no strokes under 2px at the 64-unit viewBox. The large icons
  (180px and up, where a home-screen tile has room) still come from the seal
  itself — see tools/icons.mjs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Government Degree College, Katrisarai">
  <circle cx="32" cy="32" r="32" fill="#102d40" />
  <path
    d="M32 24.5C26 19.5 18 18.5 11 20.5v23c7-2 15-1 21 4z"
    fill="#ebc783"
  />
  <path
    d="M32 24.5c6-5 14-6 21-4v23c-7-2-15-1-21 4z"
    fill="#d9b06a"
  />
  <path d="M32 24.5v23" stroke="#102d40" stroke-width="2.5" fill="none" />
</svg>
